# Reescrito para testes de carga e produção. Valores padrão preservados, exceto onde marcado com [MUDOU].
# Provedores da cascata e demais blocos de negócio estão idênticos ao original.

spring:
  application:
    name: ordem
  threads:
    virtual:
      enabled: true
  config:
    import: optional:file:.env[.properties]

  # [MUDOU] encerra sem cortar streams SSE em andamento
  lifecycle:
    timeout-per-shutdown-phase: ${SHUTDOWN_TIMEOUT:30s}

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/banco_oab_dev}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:admin}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:30}
      minimum-idle: ${DB_POOL_MIN_IDLE:10}
      connection-timeout: 5000
      validation-timeout: 5000
      leak-detection-threshold: ${DB_LEAK_DETECTION_MS:0}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: ${HIBERNATE_FORMAT_SQL:false}

  modulith:
    events:
      republish-outstanding-events-on-restart: true
    jdbc:
      schema-initialization:
        enabled: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1

# [MUDOU] shutdown gracioso e IP real do cliente atrás de proxy.
# O RateLimitFilter usa request.getRemoteAddr(): atrás de proxy/load balancer use FORWARD_HEADERS_STRATEGY=native
# (o Tomcat resolve X-Forwarded-For só de proxies confiáveis). Sem isso, todos os usuários dividem o mesmo bucket.
server:
  shutdown: graceful
  forward-headers-strategy: ${FORWARD_HEADERS_STRATEGY:none}

# [MUDOU] padrão silencioso (log de SQL e de ping distorcem teste de carga).
# Para depurar: LOG_HIBERNATE_SQL=debug LOG_PING_LEVEL=debug
logging:
  level:
    org.hibernate.SQL: ${LOG_HIBERNATE_SQL:warn}
    org.flywaydb: info
    com.exame.ordem.tutor.service.ProvedorPingService: ${LOG_PING_LEVEL:info}

app:
  admin:
    chave-cadastro: ${ADMIN_CADASTRO_CHAVE}

  jwt:
    secret: ${JWT_SECRET}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:240}

  rate-limit:
    enabled: true
    rules:
      login:
        capacity: ${RATE_LIMIT_LOGIN_CAPACITY:5}
        window: 1m
      cadastro:
        capacity: ${RATE_LIMIT_CADASTRO_CAPACITY:3}
        window: 1h

  simulado:
    tempo-limite-segundos: ${SIMULADO_TEMPO_LIMITE:18000}
    nota-corte-percentual: ${SIMULADO_NOTA_CORTE:50}
    limite-diario: ${SIMULADO_LIMITE_DIARIO:1}

  trial:
    dias: ${TRIAL_DIAS:7}

  legislacao:
    consulta:
      min-rank: ${LEGISLACAO_CONSULTA_MIN_RANK:0.15}
    embedding:
      habilitado: ${LEGISLACAO_EMBEDDING_HABILITADO:false}
      perfil: ${LEGISLACAO_EMBEDDING_PERFIL:GEMINI}
      modelo: ${LEGISLACAO_EMBEDDING_MODEL:}
      lote: ${LEGISLACAO_EMBEDDING_LOTE:32}
      intervalo: ${LEGISLACAO_EMBEDDING_INTERVALO:PT5M}

  tutor:
    cascata:
      provedores:
        # ==========================================
        # TIER 1: ULTRA-RÁPIDOS
        # ==========================================
        - id: groq-1
          base-url: https://api.groq.com/openai/v1
          api-key: ${GROQ_API_KEY:}
          model: ${GROQ_MODEL:openai/gpt-oss-120b}
          ttft: 8s
          timeout: 45s
          rpm: 6   # TPM 8000 / ~1300 tokens por request
          rpd: 900
          tpm: 7000
          tpd: 180000

        - id: groq-2
          base-url: https://api.groq.com/openai/v1
          api-key: ${GROQ_API_KEY_1:}
          model: ${GROQ_MODEL:openai/gpt-oss-120b}
          ttft: 8s
          timeout: 45s
          rpm: 6   # TPM 8000 / ~1300 tokens por request
          rpd: 900
          tpm: 7000
          tpd: 180000

        # DESATIVADO: conta sem saldo (PAYMENT_METHOD_REQUIRED). Reative após adicionar método de pagamento.
        # - id: sambanova
        #   base-url: https://api.sambanova.ai/v1
        #   api-key: ${SAMBANOVA_API_KEY:}
        #   model: ${SAMBANOVA_MODEL:gpt-oss-120b}
        #   ttft: 10s
        #   timeout: 45s
        #   rpm: 10
        #   rpd: 1000

        # ==========================================
        # TIER 2: ESTÁVEIS (NVIDIA)
        # ==========================================
        # DESATIVADO: modelo meta/llama-3.1-8b-instruct descontinuado em 2026-08-26 (HTTP 410). Troque o modelo e reative.
        # - id: nvidia-1
        #   base-url: https://integrate.api.nvidia.com/v1
        #   api-key: ${NVIDIA_API_KEY:}
        #   model: meta/llama-3.1-8b-instruct         # Modelo leve e rápido
        #   ttft: 15s
        #   timeout: 90s
        #   rpm: 30

        # DESATIVADO: retorna 404 (modelo/URL inválidos). Confirme o modelo no catálogo da NVIDIA e reative.
        # - id: nvidia-2
        #   base-url: https://integrate.api.nvidia.com/v1
        #   api-key: ${NVIDIA_API_KEY:}
        #   model: google/gemma-2-9b-it               # Modelo do Google (Fallback 1)
        #   ttft: 15s
        #   timeout: 90s
        #   rpm: 30

        # DESATIVADO: retorna 404 (modelo/URL inválidos). Confirme o modelo no catálogo da NVIDIA e reative.
        # - id: nvidia-3
        #   base-url: https://integrate.api.nvidia.com/v1
        #   api-key: ${NVIDIA_API_KEY:}
        #   model: mistralai/mistral-nemo-12b-instruct # Modelo da Mistral (Fallback 2)
        #   ttft: 15s
        #   timeout: 90s
        #   rpm: 30

        - id: gemini-1
          base-url: https://generativelanguage.googleapis.com/v1beta/openai
          api-key: ${GEMINI_API_KEY:}
          model: ${GEMINI_CHAT_MODEL:gemini-3.5-flash-lite}
          ttft: 12s
          timeout: 60s
          rpm: 8
          rpd: 400

        - id: gemini-2
          base-url: https://generativelanguage.googleapis.com/v1beta/openai
          api-key: ${GEMINI_API_KEY_1:}
          model: ${GEMINI_CHAT_MODEL:gemini-3.5-flash-lite}
          ttft: 12s
          timeout: 60s
          rpm: 8
          rpd: 400

        - id: mistral-1
          base-url: https://api.mistral.ai/v1
          api-key: ${MISTRAL_API_KEY:}
          model: ${MISTRAL_MODEL:open-mistral-nemo}
          ttft: 12s
          timeout: 45s
          rpm: 150
          rpd: 3000

        - id: mistral-2
          base-url: https://api.mistral.ai/v1
          api-key: ${MISTRAL_API_KEY_1:}
          model: ${MISTRAL_MODEL:open-mistral-nemo}
          ttft: 12s
          timeout: 45s
          rpm: 150
          rpd: 3000

        # ==========================================
        # TIER 3: FALLBACKS
        # ==========================================
        - id: openrouter-1
          base-url: https://openrouter.ai/api/v1
          api-key: ${OPENROUTER_API_KEY:}
          model: ${OPENROUTER_MODEL:nvidia/nemotron-3-ultra-550b-a55b:free}
          temperature: 0.6
          max-tokens: 4096
          ttft: 25s
          timeout: 120s
          rpm: 15
          rpd: 45
          headers:
            HTTP-Referer: http://localhost:8080
            X-Title: Simulador OAB

        # DESATIVADO: sem créditos (HTTP 402 in_flight_budget_exhausted). Adicione créditos e reative.
        # - id: openrouter-2
        #   base-url: https://openrouter.ai/api/v1
        #   api-key: ${OPENROUTER_API_KEY_1:}
        #   model: ${OPENROUTER_MODEL:google/gemma-4-31b-it}
        #   temperature: 0.6
        #   max-tokens: 4096
        #   ttft: 25s
        #   timeout: 120s
        #   rpm: 15
        #   rpd: 45
        #   headers:
        #     HTTP-Referer: http://localhost:8080
        #     X-Title: Simulador OAB

        # [NOVO] ping-url corrigido para o endpoint oficial de busca da Cloudflare
        - id: cloudflare-1
          base-url: https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/ai/v1
          ping-url: https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/ai/models/search
          api-key: ${CLOUDFLARE_API_KEY:}
          model: "@cf/meta/llama-3.1-70b-instruct"
          ttft: 20s
          timeout: 60s
          rpm: 20
          rpd: 1000

        - id: cloudflare-2
          base-url: https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID_1}/ai/v1
          ping-url: https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID_1}/ai/models/search
          api-key: ${CLOUDFLARE_API_KEY_1:}
          model: "@cf/meta/llama-3.1-70b-instruct"
          ttft: 20s
          timeout: 60s
          rpm: 20
          rpd: 1000

        - id: cohere-1
          base-url: https://api.cohere.ai/compatibility/v1
          api-key: ${COHERE_API_KEY:}
          model: ${COHERE_MODEL:command-a-03-2025}
          ttft: 25s
          timeout: 60s
          rpm: 5
          rpd: 30

        - id: cohere-2
          base-url: https://api.cohere.ai/compatibility/v1
          api-key: ${COHERE_API_KEY_1:}
          model: ${COHERE_MODEL:command-a-03-2025}
          ttft: 25s
          timeout: 60s
          rpm: 5
          rpd: 30

        # ==========================================
        # TIER 4: REDE DE SEGURANÇA LOCAL
        # ==========================================
        - id: freellmapi
          base-url: ${FREELLMAPI_URL:http://127.0.0.1:3001/v1}
          api-key: ${FREELLMAPI_API_KEY:}
          model: ${FREELLMAPI_MODEL:auto}
          ttft: 30s
          timeout: 90s

    # Fallback local, só para desenvolvimento. [MUDOU] comentário corrigido: o padrão é HABILITADO;
    # em produção defina OLLAMA_CHAT_HABILITADO=false (modelo pequeno gera respostas ruins).
    ollama-chat:
      habilitado: ${OLLAMA_CHAT_HABILITADO:true}
      url: ${OLLAMA_URL:http://localhost:11434}
      model: ${OLLAMA_CHAT_MODEL:qwen2.5:0.5b}

    # [MUDOU] cache semântico explícito (antes só tinha os defaults do código).
    # SEMANTIC_CACHE_ENABLED=false desliga o cache nos testes de carga; ao trocar o embedder
    # (RAG_OLLAMA_HABILITADO) ou o system prompt, esvazie a tabela semantic_cache ou mude o PROMPT_VERSION.
    semantic-cache:
      enabled: ${SEMANTIC_CACHE_ENABLED:true}
      similarity-threshold: ${SEMANTIC_CACHE_THRESHOLD:0.92}
      prompt-version: ${SEMANTIC_CACHE_PROMPT_VERSION:v1}
      ttl-days: ${SEMANTIC_CACHE_TTL_DAYS:30}

    # Indexação de embeddings
    # Durante teste de carga: GEMINI_INDEXADOR_HABILITADO=false OLLAMA_INDEXADOR_HABILITADO=false
    gemini-indexador:
      habilitado: ${GEMINI_INDEXADOR_HABILITADO:TRUE}

    ollama-indexador:
      habilitado: ${OLLAMA_INDEXADOR_HABILITADO:TRUE}

    embedding:
      gemini-api-key: ${GEMINI_API_KEY:}
      model: ${TUTOR_EMBEDDING_MODEL:gemini-embedding-001}
      gemini-max-concurrency: ${GEMINI_EMBEDDING_MAX_CONCURRENCY:8}
      ollama-url: ${OLLAMA_URL:http://localhost:11434}
      ollama-model: ${OLLAMA_EMBEDDING_MODEL:nomic-embed-text}
      ollama-max-concurrency: ${OLLAMA_EMBEDDING_MAX_CONCURRENCY:1}
    rag:
      top-k-semelhantes: ${RAG_TOP_K_SEMELHANTES:2}
      candidatos: ${RAG_CANDIDATOS:8}
      min-score-gemini: ${RAG_MIN_SCORE_GEMINI:0.75}
      min-score-ollama: ${RAG_MIN_SCORE_OLLAMA:0.70}
      status-bloqueados: ${RAG_STATUS_BLOQUEADOS:ERRADO,SUSPEITO}
      max-caracteres-por-fonte: ${RAG_MAX_CARACTERES_FONTE:1000}
      ollama-habilitado: ${RAG_OLLAMA_HABILITADO:true}

# Supabase Storage
supabase:
  url: ${SUPABASE_URL:}
  key: ${SUPABASE_KEY:}
  bucket: ${SUPABASE_BUCKET:simulado-prova}

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics, prometheus
  # [MUDOU] percentis por endpoint e tag da aplicação para o Grafana
  endpoint:
    health:
      show-details: when-authorized
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true