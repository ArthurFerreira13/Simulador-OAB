spring:
  application:
    name: ordem

  datasource:
    url: jdbc:postgresql://localhost:5432/banco_oab_dev
    username: postgres
    password: admin

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  modulith:
    events:
      republish-outstanding-events-on-restart: true
    jdbc:
      schema-initialization:
        enabled: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1

logging:
  level:
    org.hibernate.SQL: debug
    org.flywaydb: info

app:
  admin:
    chave-cadastro: ${ADMIN_CADASTRO_CHAVE:troque-essa-chave-antes-de-usar}

  jwt:
    secret: ${JWT_SECRET:dev-secret-com-pelo-menos-32-bytes-aqui-troque-em-producao}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:240}

  # ─────────────────────────────────────────────────────────
  # Parâmetros de simulado (RN02, RN03)
  # ─────────────────────────────────────────────────────────
  simulado:
    tempo-limite-segundos: ${SIMULADO_TEMPO_LIMITE:18000}   # 5h
    nota-corte-percentual: ${SIMULADO_NOTA_CORTE:50}        # 50% = 40/80
    limite-diario: ${SIMULADO_LIMITE_DIARIO:1}              # produção: 1/dia

  # ─────────────────────────────────────────────────────────
  # Trial reverso (D11)
  # ─────────────────────────────────────────────────────────
  trial:
    dias: ${TRIAL_DIAS:7}

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics, prometheus