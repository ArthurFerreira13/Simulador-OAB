spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/banco_oab_dev
    username: postgres
    password: admin
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:30}
      minimum-idle: ${DB_POOL_MIN_IDLE:10}
      connection-timeout: 5000
      validation-timeout: 5000
      leak-detection-threshold: ${DB_LEAK_DETECTION_MS:0}

  jpa:
    show-sql: false
    properties:
      hibernate:
        format_sql: false

logging:
  level:
    org.hibernate.SQL: info

app:
  # Rate limit de dev: aumentado para não bloquear setup do k6.
  # Em prod (application-prod.yml ou application.yaml), manter 5/min
  # para login — a proteção contra brute-force continua valendo.
  rate-limit:
    rules:
      login:
        capacity: 200     # antes: 5 (herdado do application.yaml)
        window: 1m
      cadastro:
        capacity: 50      # antes: 3
        window: 1h

  tutor:
    freellmapi:
      autostart: true
    semantic-cache:
      enabled: false